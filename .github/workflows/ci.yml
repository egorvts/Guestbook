name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy
        type: choice
        default: both
        options:
          - both
          - frontend
          - backend

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
      - name: Test
        run: go test ./...

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-backend:
    name: Deploy backend
    needs: lint-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.target != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-yc
        with:
          service-account-key: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
      - name: Build and deploy revision
        env:
          REGISTRY_ID: ${{ vars.REGISTRY_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.SERVICE_ACCOUNT_ID }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION_STRING }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/backend-build-publish.sh
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"

  deploy-frontend:
    name: Deploy frontend
    needs: frontend-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.target != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-yc
        with:
          service-account-key: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
      - name: Build and publish frontend
        env:
          BUCKET: ${{ vars.BUCKET }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
        run: bash scripts/frontend-build-publish.sh
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
